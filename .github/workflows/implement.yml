name: Implement
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  implement:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'plan/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.277
      - id: prepare
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/github-delivery.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node tools/implement.mjs
        env:
          PLAN_PATH: ${{ steps.prepare.outputs.plan }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: npm run check
      - run: node tools/review-implementation.mjs
        env:
          PLAN_PATH: ${{ steps.prepare.outputs.plan }}
          BASE_SHA: ${{ steps.prepare.outputs.base }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: node tools/github-delivery.mjs publish-implementation
        env:
          PLAN_PATH: ${{ steps.prepare.outputs.plan }}
          BASE_SHA: ${{ steps.prepare.outputs.base }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-evidence-${{ github.event.pull_request.number }}
          path: .ai/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
