name: Deploy to AWS
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Merged commit (leave both inputs empty to deploy current main)
        required: false
        type: string
      implementation_pr:
        description: Merged implementation PR number
        required: false
        type: string
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'implement/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --repo "$REPOSITORY" --ref main -f "commit=$COMMIT" -f "implementation_pr=$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aws-demo
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: eu-north-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: target
        run: node tools/github-delivery.mjs deploy-target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.commit }}
          IMPLEMENTATION_PR: ${{ inputs.implementation_pr }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.commit }}
          persist-credentials: false
      - run: npm ci
      - run: npm run check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::818028063586:role/porridgepot-github-deploy
          aws-region: eu-north-1
      - name: Deploy WAF and application
        run: node tools/demo.mjs deploy
        env:
          ALLOWED_IPV4_CIDRS: ${{ secrets.ALLOWED_IPV4_CIDRS }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_USERNAME: ${{ vars.DEMO_USERNAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: synth-${{ steps.target.outputs.commit }}
          path: cdk.out/*.template.json
          retention-days: 7
